name: e2e

# Runs the Playwright suite on every push to main and on PRs.
# Demonstrates SHARDING: the suite is split across N parallel CI jobs (different machines),
# each running its slice with --shard=i/n. Each job also uses WORKERS to parallelise across
# that machine's cores (config pins 2 in CI). A final job merges the per-shard blob reports
# into one HTML report. This is separate from the Cloudflare Pages deploy (which is unaffected).

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo (checkout + run tests).
permissions:
  contents: read

# If a newer commit lands on the same ref (e.g. a second push to a PR), cancel the now-stale
# in-progress run instead of paying for two full suites. Grouped per ref so different PRs and
# the main branch never cancel each other.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quality/e2e

jobs:
  # Fast gate: the single-file build is structurally sound (div balance + JS parses).
  # No browsers, no deps — runs in seconds before the heavier test shards.
  validate:
    name: validate build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node validate-build.js
      # The eval harness scores a probabilistic system, so its own scorer has to be deterministic
      # and correct. These fixtures need no key and no model, which is why they can gate every PR
      # while the eval itself stays a manual run. A broken scorer makes every pass-rate it ever
      # printed fiction, so this belongs with the fast checks rather than in the paid workflow.
      - run: node ../evals/run.mjs --self-test
      # The commit gate refuses emoji and em dashes at the git boundary, so a defect in it is a
      # defect in every commit that passed since it landed. It reads the index and HEAD through
      # git, which means its tests need no browser and no key, and they belong with the fast
      # checks for the same reason the scorer self-test does.
      - run: node --test ../tools/check-emoji.test.mjs
      # docs/QA-STATUS.md says what this arc has finished, and a status nobody re-checks drifts.
      # This refuses a phase claiming to be done whose files are not in the tree. It reads the
      # repository and nothing else, so it belongs with the checks that need no install.
      - run: node ../tools/qa-status.mjs --check

  test:
    name: test (shard ${{ matrix.shard }}/2)
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # SHARD_TOTAL = 2 (keep the /2 below in sync with this list)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quality/e2e/package-lock.json
      - run: npm ci
      # Cache the downloaded browser (~150 MB) keyed by the exact Playwright version, so we only
      # re-download it when that version changes. Read the version AFTER npm ci so it's resolvable.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # Cache MISS: full install (browser binary + OS libs). Cache HIT: the binary is restored,
      # so we only need the OS libraries (apt), which aren't stored in the cached folder.
      - name: Install Playwright (full, on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # This step hung on shard 1 three times in a row, once for 98 minutes, while shard 2 ran the
      # identical command on the same commit in about 70 seconds. `install-deps` hands over to
      # apt-get under sudo, and the log stops dead right after "Switching to root user" without a
      # single line of apt output, so apt never got a reply from its mirror. It is a network
      # problem on that runner, not a slow install.
      #
      # An earlier version of this comment blamed the two shards colliding on an apt lock. That was
      # wrong and is corrected here: every job in a matrix gets its own virtual machine, so there is
      # no lock for them to share.
      #
      # timeout-minutes is the fix that matters, and it is independent of whatever apt is doing. The
      # step had no bound, so it inherited the job's six-hour default. That is why a stuck package
      # manager cost an hour and a half of a required check instead of three minutes.
      #
      # continue-on-error was added as a workaround and turned out to be the right answer. When the
      # timeout fired, the suite ran anyway and every test on this shard passed, which proves the
      # libraries were already in the runner image and this step is redundant on the cache-hit path.
      # Nothing is hidden either way: if they were ever genuinely missing, the browser would fail to
      # launch in the step below with Playwright's own error naming the package. The gate is the
      # suite running, not the deps installing.
      #
      # Left in place rather than deleted, because removing it belongs in its own change, where the
      # cache-miss path can be reasoned about at the same time.
      - name: Install OS deps only (on cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium
      # Drift guard: the README publishes a test count, and a hand-maintained number in docs goes
      # stale silently. This asks the runner for the real count and fails if the badge disagrees.
      # Runs on shard 1 only: it needs the deps this job already installed, so reusing them costs
      # about two seconds, where a separate job would pay for another checkout and npm ci.
      # Lint the suite against the rules this repository learned the hard way: no fixed waits, no
      # conditional in a test, every test asserts something, no forced clicks, no page pause, and
      # no undefined identifier. It runs here rather than in the fast job because it needs the
      # install this job already did, and npx would otherwise fetch an unpinned eslint per run.
      - name: Lint the end-to-end suite
        if: matrix.shard == 1
        run: npx eslint .
      - name: Check the README test count has not drifted
        if: matrix.shard == 1
        run: node count-tests.js --check
      # A disabled test is invisible to every other check here: it still appears in `--list`, so the
      # count above does not move and the run below still goes green. This is the only thing that
      # notices. It matters most now that an agent can edit the suite (see the healer's local policy).
      - name: Check no test has been silently disabled
        if: matrix.shard == 1
        run: node ../../quality/tools/check-skips.mjs
      # @visual is filtered by the config (grepInvert), not by a flag here, so the same rule holds
      # for every entry point. It stays off until Linux baselines exist; the visual-baselines
      # workflow generates them, and enabling this gate is the commit that adds them.
      # --project is load-bearing. The config declares a second project, `generated`, which is the
      # authoring zone for agent-drafted tests. Those gate nothing and nobody has reviewed them, so
      # a red one must never block a merge and a green one must never be mistaken for coverage.
      # Naming the gated project here is what keeps that true no matter what lands in the zone.
      - name: Run shard ${{ matrix.shard }} of 2
        run: npx playwright test --project=mobile-chromium --shard=${{ matrix.shard }}/2
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: quality/e2e/blob-report
          retention-days: 7

  merge-report:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quality/e2e/package-lock.json
      - run: npm ci
      - name: Download all blob reports
        uses: actions/download-artifact@v8
        with:
          path: quality/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: quality/e2e/playwright-report
          retention-days: 14
