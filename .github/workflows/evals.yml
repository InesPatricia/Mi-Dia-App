name: evals

# MANUAL agentic-eval run: scores the extraction task in evals/ against its golden dataset and
# fails if the pass-rate drops below the floor. Manual (workflow_dispatch) because each run costs
# LLM tokens and the subject is a stable demonstration, not a per-commit gate. Needs the
# ANTHROPIC_API_KEY secret; without it the runner cleanly no-ops (see evals/run.mjs).

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Pass-rate floor (0..1)"
        required: false
        default: "0.8"

permissions:
  contents: read

jobs:
  evals:
    name: agentic evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_THRESHOLD: ${{ inputs.threshold }}
        run: node evals/run.mjs
