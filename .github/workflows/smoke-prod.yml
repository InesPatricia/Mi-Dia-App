name: smoke-prod

# Post-deploy smoke against the LIVE production site (Cloudflare Pages).
# Runs on push to main (i.e. after a merge): it waits for Cloudflare to publish the new build
# (wait-for-deploy.js polls the live sw.js for the just-merged CACHE), then runs a small
# Playwright smoke suite against https://mi-dia-app.pages.dev.
#
# Informational only: it triggers post-merge on main, so it NEVER gates a PR. It is separate
# from e2e.yml (which tests the build in CI against a local http-server before merge) and from
# the Cloudflare deploy itself. Can also be run on demand via the Actions tab (workflow_dispatch).
#
# A second job (lighthouse) runs AFTER the smoke: the performance/a11y/best-practices/PWA
# baseline against the same live URL. It lives here (not in its own workflow) because it has
# the same trigger, the same target and the same "post-deploy net" semantics — and `needs: smoke`
# reuses the wait-for-deploy guarantee, so Lighthouse always measures the build that just shipped.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: read-only smoke against the live site, no repo writes needed.
permissions:
  contents: read

defaults:
  run:
    working-directory: e2e

env:
  PROD_URL: https://mi-dia-app.pages.dev

jobs:
  smoke:
    name: production smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare to publish the new build
        run: node wait-for-deploy.js
      - name: Run production smoke
        run: npx playwright test --config=playwright.prod.config.js
      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-prod-report
          path: e2e/playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse baseline
    # After the smoke: (1) don't measure a build that failed basic checks, and (2) the smoke
    # job's wait-for-deploy already proved the NEW build is live, so no stale measurements.
    needs: smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        # Override the workflow-level `e2e` default: lighthouserc.cjs lives at the repo root.
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 18 }
      # PINNED: 0.13.x = Lighthouse 11, the last major with the PWA category (removed in
      # Lighthouse 12). Full rationale + budgets with per-threshold comments: lighthouserc.cjs.
      - run: npm install -g @lhci/cli@0.13.x
      # autorun = collect (3 runs, median) + assert (budgets) + upload (filesystem).
      # Uses the Chrome preinstalled on the ubuntu-latest runner.
      - run: lhci autorun --config=lighthouserc.cjs
      - name: Write Lighthouse scores to the run summary
        # Runs even if the budgets failed above, so the scores are visible exactly when it matters.
        if: ${{ !cancelled() }}
        run: node scripts/lh-summary.mjs
      - name: Upload Lighthouse reports
        # Upload even when an assertion fails — that's exactly when the report matters most.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci-report
          retention-days: 14
